workflows:
  survey-works-android:
    name: Survey Works Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          set -e
          unzip -o Survey_Works_Android_Studio_Project_Icon_Updated.zip -d android-project

      - name: Locate Android project
        script: |
          set -e
          PROJECT_DIR="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build Android APK
        script: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            echo "Gradle wrapper missing. Using Gradle 8.7"

            cd "$HOME"
            curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
            unzip -q -o gradle.zip

            cd "$PROJECT_DIR"
            "$HOME/gradle-8.7/bin/gradle" --no-daemon clean assembleDebug
          fi

    artifacts:
      - android-project/**/build/outputs/apk/**/*.apk
