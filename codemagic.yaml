
workflows:
  survey-works-android:
    name: Survey Works Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          set -e
          unzip -o Survey_Works_Android_Studio_Project_Icon_Updated.zip -d android-project

      - name: Locate Gradle project
        script: |
          set -e
          PROJECT_DIR="$(find android-project -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Build Android APK
        script: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

    artifacts:
      - android-project/**/build/outputs/apk/**/*.apk
