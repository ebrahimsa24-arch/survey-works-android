
name: Build Survey Works APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Survey_Works_Android_Studio_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        run: |
          unzip -q Survey_Works_Android_Studio_Project.zip -d buildsrc
          test -f buildsrc/surveyworks-apk/settings.gradle

      - name: Build debug APK
        working-directory: buildsrc/surveyworks-apk
        run: gradle --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Survey-Works-APK
          path: buildsrc/surveyworks-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
